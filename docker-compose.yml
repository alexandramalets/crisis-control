# Локальный запуск всех компонентов. Каждый сервис собирается и настраивается независимо:
# для размещения на разных узлах достаточно запускать сервис отдельно и указать адреса
# соседних узлов (DB_HOST, ANALYTICS_SERVICE_URL, BACKEND_UPSTREAM) в переменных окружения.
name: crisis-analytics

services:
  database:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crisis_analytics}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Задайте POSTGRES_ADMIN_PASSWORD в .env}
      APP_DB_USER: ${DB_USER:-crisis_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PUBLISHED_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  analytics-service:
    build: ./analytics-service
    image: crisis-analytics/analytics-service:0.1.0
    restart: unless-stopped
    environment:
      PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANALYTICS_SERVICE_KEY: ${ANALYTICS_SERVICE_KEY:?Задайте ANALYTICS_SERVICE_KEY в .env}
    ports:
      - "${ANALYTICS_BIND_ADDRESS:-127.0.0.1}:${ANALYTICS_PUBLISHED_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-m", "app.docker_health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [internal]

  backend:
    build: ./backend
    image: crisis-analytics/backend:0.1.0
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-crisis_analytics}
      DB_USER: ${DB_USER:-crisis_app}
      DB_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      # Схема БД обновляется до последней миграции при каждом запуске сервера
      DB_MIGRATE_ON_STARTUP: "true"
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8001}
      ANALYTICS_SERVICE_KEY: ${ANALYTICS_SERVICE_KEY:?Задайте ANALYTICS_SERVICE_KEY в .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Задайте JWT_SECRET_KEY в .env}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATA_DIR: /var/lib/crisis-analytics/data
      DATASET_ENCRYPTION_KEY: ${DATASET_ENCRYPTION_KEY:?Задайте DATASET_ENCRYPTION_KEY в .env}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
    depends_on:
      database:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dataset_files:/var/lib/crisis-analytics/data
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PUBLISHED_PORT:-8000}:8000"
    networks: [internal, edge]

  frontend:
    build: ./frontend
    image: crisis-analytics/frontend:0.1.0
    restart: unless-stopped
    environment:
      FRONTEND_PORT: 8080
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PUBLISHED_PORT:-8080}:8080"
    networks: [edge]

networks:
  # Сеть клиента и сервера
  edge: {}
  # Внутренняя сеть сервера, СУБД и аналитического сервиса; клиент к ней не подключён
  internal: {}

volumes:
  pgdata:
  dataset_files:
